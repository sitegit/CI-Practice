name: Android CI Build

# Запускаем скрипт при пуше в main, master, develop, dev
on:
  push:
    branches: [ "main", "master", "develop", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Создаем файл google-services.json из секрета ПЕРЕД любой сборкой
      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json

      # ==========================================
      # БЛОК ДЛЯ DEBUG (Ветка develop / dev)
      # ==========================================

      - name: Build Debug APK
        # Запускается только если ветка develop или dev
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/dev'
        run: ./gradlew assembleDebug

      - name: Upload Debug APK to Artifacts
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # ==========================================
      # БЛОК ДЛЯ RELEASE (Ветка main / master)
      # ==========================================

      - name: Decode Keystore
        # Декодируем ключ ТОЛЬКО для релиза
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build Release APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Release APK to Artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
